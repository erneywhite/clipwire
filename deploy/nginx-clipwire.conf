# Блок для конфига сайта clip.example.com в nginx, вместо стандартного location /.
# Нужен, если в панели нет переключателя WebSocket для обратного прокси.
location / {
    proxy_pass http://127.0.0.1:3340;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # Токен relay передаётся в заголовке Authorization, его нельзя терять.
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
    proxy_buffering off;
}

# Необязательно: вместо служебной страницы iroh-relay на корне домена
# отправлять браузер на страницу проекта. Клиентам корень не нужен, они ходят
# на /relay и служебные пути relay.
location = / {
    return 302 https://github.com/erneywhite/clipwire;
}
