# Compose с готовым образом: для панели управления с Docker или `docker compose up -d`.
# Образ собирается в GitHub Actions, на сервере ничего не компилируется.
# Обновление: pull образа и пересоздание контейнера (down/up в панели).
#
# Перед запуском поменяй CLIPWIRE_PUBLIC_URL на свой домен. На этот домен
# в панели настраивается обратный прокси с SSL и WebSocket на http://127.0.0.1:3340.
services:
  clipwire:
    image: ghcr.io/erneywhite/clipwire-server:latest
    restart: unless-stopped
    # Ужесточение: файловая система образа только для чтения (пишется лишь том
    # /data), никаких capabilities и повышения прав.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # SQLite может писать временные файлы в /tmp: он в памяти.
    tmpfs:
      - /tmp
    environment:
      CLIPWIRE_PUBLIC_URL: https://clip.example.com
      # Необязательные, значения по умолчанию:
      # CLIPWIRE_MAX_ITEM_BYTES: 8388608
      # CLIPWIRE_HISTORY_LEN: 50
      # CLIPWIRE_TTL_HOURS: 24
      # CLIPWIRE_MAX_FILE_BYTES: 104857600
      # CLIPWIRE_BLOB_QUOTA: 2147483648
      # CLIPWIRE_BLOB_TOTAL_QUOTA: 21474836480
      # CLIPWIRE_BLOB_STALL_SECS: 120
      # RUST_LOG: info
    ports:
      # relay по HTTP, только для локального прокси панели
      - "127.0.0.1:3340:3340"
      # прямые QUIC-соединения; если порт закрыт, всё пойдёт через relay
      - "7843:7843/udp"
    volumes:
      - clipwire-data:/data

volumes:
  clipwire-data:
