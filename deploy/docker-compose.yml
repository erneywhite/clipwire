# Сервер Clipwire со сборкой образа на месте. Готовый образ — docker-compose.image.yml.
# Перед запуском поменяй CLIPWIRE_PUBLIC_URL на свой домен.
services:
  clipwire:
    build: ..
    image: clipwire-server
    restart: unless-stopped
    # Ужесточение: файловая система образа только для чтения (пишется лишь том
    # /data), никаких capabilities и повышения прав.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # SQLite может писать временные файлы в /tmp: он в памяти.
    tmpfs:
      - /tmp
    # Предел памяти: если что-то пойдёт не так, контейнер упрётся в него, а не
    # займёт всю память машины. Для больших групп и картинок можно поднять.
    mem_limit: 1g
    # Лог не растёт без конца: три файла по 10 МБ.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      CLIPWIRE_PUBLIC_URL: https://clip.example.com
      # Необязательные, значения по умолчанию:
      # CLIPWIRE_MAX_ITEM_BYTES: 8388608
      # CLIPWIRE_HISTORY_LEN: 50
      # CLIPWIRE_TTL_HOURS: 24
      # CLIPWIRE_MAX_FILE_BYTES: 104857600
      # CLIPWIRE_BLOB_QUOTA: 2147483648
      # CLIPWIRE_BLOB_TOTAL_QUOTA: 21474836480
      # CLIPWIRE_BLOB_STALL_SECS: 120
      # CLIPWIRE_RESERVE_TTL_SECS: 600
      # CLIPWIRE_MAX_RESERVES: 512
      # CLIPWIRE_MAX_GROUPS: 100
      # CLIPWIRE_MAX_DEVICES: 64
      # CLIPWIRE_HISTORY_TOTAL_BYTES: 1073741824
      # CLIPWIRE_MAX_DEVICE_CONNS: 4
      # CLIPWIRE_PIN_MAX: 5000
      # CLIPWIRE_PIN_BYTES: 2147483648
      # CLIPWIRE_PIN_RECORDS: 20000
      # CLIPWIRE_PIN_TOTAL_BYTES: 4294967296
      # Скорость, с которой relay читает от одного клиента, байт/с (0 - без предела):
      # CLIPWIRE_RELAY_RATE: 16777216
      # Сколько неизвестных серверу устройств (новых и исключённых) держат relay сразу:
      # CLIPWIRE_RELAY_GUESTS: 32
      # RUST_LOG: info
      # Печатать код сервера (с ключом администратора) при каждом запуске,
      # а не только при первом:
      # CLIPWIRE_PRINT_SERVER_CODE: 1
    ports:
      # relay по HTTP, наружу его выставляет nginx с TLS
      - "127.0.0.1:3340:3340"
      # прямые QUIC-соединения; если порт закрыт, всё пойдёт через relay
      - "7843:7843/udp"
    volumes:
      - clipwire-data:/data

volumes:
  clipwire-data:
