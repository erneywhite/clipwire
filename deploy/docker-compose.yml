# Сервер Clipwire со сборкой образа на месте. Готовый образ — docker-compose.image.yml.
# Перед запуском поменяй CLIPWIRE_PUBLIC_URL на свой домен.
services:
  clipwire:
    build: ..
    image: clipwire-server
    restart: unless-stopped
    # Ужесточение: файловая система образа только для чтения (пишется лишь том
    # /data), никаких capabilities и повышения прав.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # SQLite может писать временные файлы в /tmp: он в памяти.
    tmpfs:
      - /tmp
    environment:
      CLIPWIRE_PUBLIC_URL: https://clip.example.com
      # Необязательные, значения по умолчанию:
      # CLIPWIRE_MAX_ITEM_BYTES: 8388608
      # CLIPWIRE_HISTORY_LEN: 50
      # CLIPWIRE_TTL_HOURS: 24
      # CLIPWIRE_MAX_FILE_BYTES: 104857600
      # CLIPWIRE_BLOB_QUOTA: 2147483648
      # CLIPWIRE_BLOB_TOTAL_QUOTA: 21474836480
      # CLIPWIRE_BLOB_STALL_SECS: 120
      # CLIPWIRE_RESERVE_TTL_SECS: 600
      # CLIPWIRE_MAX_RESERVES: 64
      # CLIPWIRE_MAX_GROUPS: 100
      # CLIPWIRE_HISTORY_TOTAL_BYTES: 1073741824
      # CLIPWIRE_MAX_DEVICE_CONNS: 4
      # RUST_LOG: info
    ports:
      # relay по HTTP, наружу его выставляет nginx с TLS
      - "127.0.0.1:3340:3340"
      # прямые QUIC-соединения; если порт закрыт, всё пойдёт через relay
      - "7843:7843/udp"
    volumes:
      - clipwire-data:/data

volumes:
  clipwire-data:
