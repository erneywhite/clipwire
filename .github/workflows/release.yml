# Релиз клиента: по тегу vX.Y.Z собирает установщики Windows, macOS и Linux,
# подписывает файлы обновления и публикует релиз с latest.json, который читает
# автообновление.
#
# Порядок: draft создаёт черновик релиза; три сборки идут параллельно и
# заливают в него установщики с подписями (одно подтверждение окружения
# release на все три); publish собирает latest.json из .sig
# (.github/scripts/latest_json.py), ставит метку рекомендуемого выпуска и
# публикует черновик. До публикации «последний релиз» остаётся прежним, так
# что клиенты не видят выпуск без части платформ. Упала сборка — черновик
# остаётся, его можно перезапустить или удалить.
#
# Нужны секреты окружения release:
#   TAURI_SIGNING_PRIVATE_KEY          — приватный ключ подписи обновлений
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — пароль к нему
#   APPLE_CERTIFICATE                  — base64 от .p12 сертификата «Clipwire Self-Signed»
#   APPLE_CERTIFICATE_PASSWORD         — пароль .p12
# Как сделать сертификат — docs/macos.md, п. 7. Нотаризации нет (APPLE_ID не нужен).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TAG: ${{ github.ref_name }}
  REPO: ${{ github.repository }}

jobs:
  draft:
    # Ручной запуск с ветки не должен публиковать релиз: нужен тег vX.Y.Z.
    # Остальные задания ждут это и без него тоже пропускаются.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.r.outputs.id }}
    steps:
      - id: r
        name: Черновик релиза
        env:
          BODY: Windows — файл Clipwire_*_windows_x64-setup.exe. macOS (13 и новее, Apple Silicon и Intel) — Clipwire_*_macos_universal.dmg, первый запуск описан в README. Linux — Clipwire_*_linux_amd64.deb (Ubuntu, Debian, Mint) или Clipwire_*_linux_amd64.AppImage (остальные). Уже установленные копии обновятся сами (.deb — по кнопке, с паролем).
        run: |
          set -euo pipefail
          # Перезапуск: черновик или релиз с этим тегом уже есть — берём его.
          ID="$(gh api "repos/$REPO/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)"
          if [ -z "$ID" ]; then
            ID="$(gh api "repos/$REPO/releases" -f tag_name="$TAG" -f name="Clipwire $TAG" \
              -f body="$BODY" -F draft=true --jq .id)"
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  windows:
    needs: draft
    # Секреты подписи лежат в окружении release: оно пускает только теги v*
    # и ждёт подтверждения выпуска. Три сборки стартуют вместе, поэтому
    # подтверждение одно на все.
    environment: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.draft.outputs.id }}
          # latest.json собирает задание publish.
          includeUpdaterJson: false
          # ОС в имени файла: в списке файлов выпуска сразу видно, что качать.
          # Имена должны совпадать с PLATFORMS в latest_json.py.
          assetNamePattern: '[name]_[version]_windows_[arch][setup][ext]'

  macos:
    needs: draft
    environment: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Постоянный самоподписанный сертификат — во временную связку ключей:
      # одна «личность» у всех версий, и macOS не сбрасывает «Универсальный
      # доступ» после обновления (docs/macos.md). Сертификат не доверенный,
      # но codesign им подписывает по имени.
      - name: Сертификат подписи кода
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/clipwire-signing.keychain-db"
          KC_PASS="$(uuidgen)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -p codesigning "$KC"

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: Clipwire Self-Signed
        with:
          projectPath: apps/desktop
          args: --target universal-apple-darwin
          releaseId: ${{ needs.draft.outputs.id }}
          includeUpdaterJson: false
          assetNamePattern: '[name]_[version]_macos_[arch][ext]'

      # Подпись должна быть сертификатом, а не ad-hoc: у ad-hoc требование —
      # хэш кода, и разрешения macOS слетали бы с каждым обновлением.
      - name: Проверка подписи
        run: |
          APP=target/universal-apple-darwin/release/bundle/macos/Clipwire.app
          codesign --verify --deep --strict "$APP"
          REQ="$(codesign -dr - "$APP" 2>&1)"
          echo "$REQ"
          echo "$REQ" | grep -q 'certificate root = H"'

  # Ubuntu 22.04 — старый glibc: пакеты запускаются и на более старых системах.
  linux:
    needs: draft
    environment: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Системные библиотеки
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy — сам AppImage, а FUSE на раннерах нет.
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.draft.outputs.id }}
          includeUpdaterJson: false
          assetNamePattern: '[name]_[version]_linux_[arch][ext]'

  # latest.json, метка рекомендуемого выпуска и публикация. Секреты не нужны:
  # подписи уже лежат в черновике файлами .sig.
  publish:
    needs: [draft, windows, macos, linux]
    runs-on: ubuntu-latest
    env:
      ID: ${{ needs.draft.outputs.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: latest.json и публикация
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/rel"; mkdir -p "$W/sigs"
          # Черновик не находится по тегу обычными запросами — файлы по id.
          gh api "repos/$REPO/releases/$ID/assets" --paginate \
            --jq '.[] | select(.name | endswith(".sig")) | "\(.id) \(.name)"' |
          while read -r AID NAME; do
            gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$AID" > "$W/sigs/$NAME"
          done
          ls -l "$W/sigs"
          # Сообщение тега — через API: checkout превращает аннотированный тег в лёгкий.
          : > "$W/msg.txt"
          REF="$(gh api "repos/$REPO/git/ref/tags/$TAG")"
          if [ "$(jq -r .object.type <<<"$REF")" = "tag" ]; then
            gh api "repos/$REPO/git/tags/$(jq -r .object.sha <<<"$REF")" --jq .message > "$W/msg.txt"
          fi
          python3 .github/scripts/latest_json.py --version "${TAG#v}" \
            --base-url "https://github.com/$REPO/releases/download/$TAG" \
            --sigs "$W/sigs" --tag-message "$W/msg.txt" \
            --out "$W/latest.json" --note "$W/note.txt"
          cat "$W/latest.json"
          # Перезапуск: старый latest.json в черновике заменяется.
          OLD="$(gh api "repos/$REPO/releases/$ID/assets" --paginate --jq '.[] | select(.name == "latest.json") | .id')"
          [ -z "$OLD" ] || gh api -X DELETE "repos/$REPO/releases/assets/$OLD"
          UPLOAD="$(gh api "repos/$REPO/releases/$ID" --jq .upload_url | sed 's/{.*}//')"
          curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
            --data-binary "@$W/latest.json" "$UPLOAD?name=latest.json" > /dev/null
          BODY="$(gh api "repos/$REPO/releases/$ID" --jq .body)"
          NOTE="$(cat "$W/note.txt")"
          if [ -n "$NOTE" ] && [[ "$BODY" != "$NOTE"* ]]; then
            BODY="$NOTE"$'\n\n'"$BODY"
          fi
          gh api -X PATCH "repos/$REPO/releases/$ID" -f body="$BODY" -F draft=false -f make_latest=true > /dev/null
          echo "опубликован $TAG"
