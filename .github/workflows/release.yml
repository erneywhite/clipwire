# Релиз клиента: по тегу vX.Y.Z собирает установщик, подписывает файлы
# обновления и публикует релиз с latest.json, который читает автообновление.
#
# Нужны секреты репозитория:
#   TAURI_SIGNING_PRIVATE_KEY          — приватный ключ подписи обновлений
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — пароль к нему
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Clipwire ${{ github.ref_name }}
          releaseBody: Установщик для Windows — файл Clipwire_*_x64-setup.exe. Уже установленные копии обновятся сами.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
