# Релиз клиента: по тегу vX.Y.Z собирает установщик, подписывает файлы
# обновления и публикует релиз с latest.json, который читает автообновление.
#
# Нужны секреты репозитория:
#   TAURI_SIGNING_PRIVATE_KEY          — приватный ключ подписи обновлений
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — пароль к нему
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Clipwire ${{ github.ref_name }}
          releaseBody: Установщик для Windows — файл Clipwire_*_x64-setup.exe. Уже установленные копии обновятся сами.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
