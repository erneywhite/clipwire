# Собирает Docker-образ сервера и публикует его в GHCR:
#   ghcr.io/erneywhite/clipwire-server:latest  — последний main
#   ghcr.io/erneywhite/clipwire-server:X.Y.Z   — релизный тег vX.Y.Z
# Раз в неделю образ собирается заново, чтобы обновления базового distroless
# доходили до сервера и без новых коммитов.
name: server-image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "crates/**"
      - "apps/desktop/src-tauri/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".github/workflows/server-image.yml"
  schedule:
    # Понедельник, 03:17 UTC; расписание всегда идёт с main.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/clipwire-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # Базовый образ берём свежий, а не из кэша сборщика.
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
