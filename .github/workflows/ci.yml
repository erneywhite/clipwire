name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Системные библиотеки, без которых Tauri не собирается на Linux.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev             libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      # generate_context! встраивает собранный фронтенд, поэтому он нужен до cargo.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci && npm run build
        working-directory: apps/desktop

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # macOS: предел 256 открытых файлов на процесс, а сетевые тесты
      # поднимают десятки iroh-эндпоинтов параллельно.
      - run: |
          if [ "$RUNNER_OS" = macOS ]; then ulimit -n 10240; fi
          cargo test --workspace --all-features
        shell: bash
      - run: for f in src/lib/*.test.ts; do node "$f"; done
        shell: bash
        working-directory: apps/desktop
