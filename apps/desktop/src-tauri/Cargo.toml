[package]
name = "clipwire-desktop"
description = "Clipwire — общий буфер обмена: приложение с треем, окном вставки и настройками"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[lib]
name = "clipwire_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
anyhow = "1.0.104"
clipwire-agent = { path = "../../../crates/clipwire-agent" }
# `tokio`: кадры канала ИИ (`proto::io`) для моста MCP.
clipwire-core = { path = "../../../crates/clipwire-core", features = ["tokio"] }
data-encoding = "2.11.1"
# Случайная метка границ содержимого в ответах моста MCP.
getrandom = "0.4"
# Мост MCP (`clipwire-desktop --mcp`): официальный SDK, сервер на stdio.
rmcp = { version = "3.11.0", default-features = false, features = ["server", "macros", "base64", "transport-io"] }
# HTTP для карточек ссылок. Те же версии, что уже тянут iroh и автообновление;
# криптопровайдер ring ставится на старте (aws-lc не нужен).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
# Сравнение версий после установки обновления (та же версия, что у Tauri).
semver = "1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
# Клиент MCP для сквозного теста моста.
rmcp = { version = "3.11.0", default-features = false, features = ["client", "server", "macros", "base64", "transport-io"] }

[target.'cfg(unix)'.dependencies]
# Канал MCP: geteuid для своего каталога сокета в /tmp.
libc = "0.2.191"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDictionary", "NSString", "NSValue", "NSData"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSRunningApplication", "NSSound"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventTypes", "CGRemoteOperation"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["xtest"] }
# Те же версии, что у Tauri: номер X-окна, чтобы попросить для него фокус.
gtk = "0.18"
gdkx11 = "0.18"
futures-util = "0.3"
# Вставка на Wayland через портал удалённого управления (по разрешению человека).
ashpd = { version = "0.14", default-features = false, features = ["tokio", "remote_desktop", "screencast", "global_shortcuts"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Registry",
    "Win32_Media_Audio",
    # Канал MCP: DACL именованного канала только для текущего пользователя.
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    # Канал MCP: чей процесс держит канал (`GetNamedPipeServerProcessId`).
    "Win32_System_Pipes",
    # Канал MCP: какая программа запустила мост (родитель по снимку процессов).
    "Win32_System_Diagnostics_ToolHelp",
] }
