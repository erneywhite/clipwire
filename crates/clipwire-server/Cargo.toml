[package]
name = "clipwire-server"
description = "Сервер Clipwire: почтовый ящик для зашифрованных элементов и встроенный iroh-relay"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
clipwire-core = { path = "../clipwire-core", features = ["tokio"] }
data-encoding = "2.11.1"
getrandom = "0.4"
iroh = "1.4.1"
iroh-relay = { version = "1.4.1", features = ["server"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = "1.29.2"
