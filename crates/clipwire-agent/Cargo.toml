[package]
name = "clipwire-agent"
description = "Клиент Clipwire: синхронизирует буфер обмена через свой сервер"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
chacha20poly1305 = "0.11.0"
clipwire-core = { path = "../clipwire-core", features = ["tokio"] }
directories = "6.0.0"
getrandom = "0.4"
image = { version = "0.25.10", default-features = false, features = ["png"] }
iroh = "1.4.1"
postcard = { version = "1.1.3", features = ["use-std"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.2", features = ["v7"] }

[target."cfg(windows)".dependencies]
clipboard-win = "5.4.3"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_Security_Cryptography", "Win32_System_Ole", "Win32_Graphics_Gdi", "Win32_System_Threading"] }

[dev-dependencies]
clipwire-server = { path = "../clipwire-server" }
uuid = { version = "1.29.2", features = ["v7"] }
