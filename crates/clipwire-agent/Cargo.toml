[package]
name = "clipwire-agent"
description = "Клиент Clipwire: синхронизирует буфер обмена через свой сервер"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
clipwire-core = { path = "../clipwire-core", features = ["tokio"] }
directories = "6.0.0"
getrandom = "0.4"
iroh = "1.4.1"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tray-icon = "0.26.1"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_Security_Cryptography", "Win32_System_Ole", "Win32_Graphics_Gdi"] }

[dev-dependencies]
clipwire-server = { path = "../clipwire-server" }
uuid = { version = "1.29.2", features = ["v7"] }
